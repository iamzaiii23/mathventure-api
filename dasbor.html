<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Peneliti - Mathventure</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.12/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- CSS Kustom -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: #f3f4f6; /* Abu-abu sangat muda untuk latar belakang SaaS */
            overflow-x: hidden;
        }
        
        /* Sidebar bergaya SaaS */
        .sidebar {
            min-height: 100vh;
            background-color: var(--color-nila);
            color: white;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar .nav-link {
            color: #d1d5db;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: var(--color-sky-indigo);
            color: white;
        }
        .sidebar-brand {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        /* Kartu Metrik */
        .metric-card {
            border: none;
            border-radius: 12px;
            transition: transform 0.3s;
        }
        .metric-card:hover {
            transform: translateY(-5px);
        }
        .metric-icon {
            font-size: 2.5rem;
            opacity: 0.2;
            position: absolute;
            right: 20px;
            top: 20px;
        }

        /* Tabel Data */
        .table-custom {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
        }
        .table-custom th {
            background-color: var(--color-sky-light);
            color: var(--color-nila);
        }
    </style>
</head>
<body>

    <div class="d-flex">
        <!-- SIDEBAR -->
        <div class="sidebar p-4 d-flex flex-column" style="width: 260px;">
            <div class="sidebar-brand text-center">
                <h4 class="fw-bold mb-0 text-white"><i class="fas fa-chart-pie me-2" style="color: var(--color-gold);"></i> Mathventure</h4>
                <small>Dasbor Riset</small>
            </div>
            <ul class="nav flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link active"><i class="fas fa-home me-2"></i> Ringkasan</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#addUserModal"><i class="fas fa-user-plus me-2"></i> Tambah Siswa</a>
                </li>
            </ul>
            <hr>
            <button class="btn btn-outline-light w-100" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Keluar</button>
        </div>

        <!-- MAIN CONTENT -->
        <div class="flex-grow-1 p-5">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold" style="color: var(--color-sogan);">Laporan Eksperimen</h2>
                <!-- Tombol Export Excel -->
                <button class="btn fw-bold shadow-sm" style="background-color: #10B981; color: white;" onclick="downloadExcel()">
                    <i class="fas fa-file-excel me-2"></i> Unduh Excel
                </button>
            </div>

            <!-- Kartu Metrik Ringkasan -->
            <div class="row mb-5">
                <div class="col-md-4">
                    <div class="card metric-card shadow-sm p-4" style="background-color: var(--color-sky-indigo); color: white;">
                        <i class="fas fa-users metric-icon"></i>
                        <h6 class="text-uppercase mb-1 opacity-75">Total Siswa Aktif</h6>
                        <h2 class="fw-bold mb-0" id="totalSiswa">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card metric-card shadow-sm p-4" style="background-color: var(--color-sogan); color: white;">
                        <i class="fas fa-gamepad metric-icon"></i>
                        <h6 class="text-uppercase mb-1 opacity-75">Sesi Selesai</h6>
                        <h2 class="fw-bold mb-0" id="totalSesi">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card metric-card shadow-sm p-4" style="background-color: var(--color-gold); color: var(--color-dark);">
                        <i class="fas fa-star metric-icon"></i>
                        <h6 class="text-uppercase mb-1 opacity-75">Rata-rata Skor (XP)</h6>
                        <h2 class="fw-bold mb-0" id="rataSkor">0</h2>
                    </div>
                </div>
            </div>

            <!-- Tabel Data Siswa -->
            <div class="table-custom shadow-sm p-4">
                <h5 class="fw-bold mb-3" style="color: var(--color-nila);">Detail Capaian Siswa</h5>
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID Sesi</th>
                            <th>Nama Siswa</th>
                            <th>Waktu Selesai</th>
                            <th class="text-center">Total XP</th>
                            <th class="text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Baris akan di-render oleh JS -->
                        <tr><td colspan="5" class="text-center py-4">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL: Tambah Siswa -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Tambah Akun Siswa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addUserForm">
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" class="form-control" id="newNama" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">NIS (Username)</label>
                            <input type="text" class="form-control" id="newNIS" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kata Sandi Sementara</label>
                            <input type="password" class="form-control" id="newPass" value="123456" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2">Simpan Data</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.12/dist/sweetalert2.all.min.js"></script>
    <script src="js/api-handler.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
        });

        // 1. Fetch Data Metrik
        async function loadDashboardData() {
            // Catatan: Pastikan kamu sudah mengatur endpoint api/admin_dashboard.php di backend untuk me-return JSON
            const result = await fetchAPI('admin_dashboard.php');
            
            // Dummy Data jika backend belum mengembalikan data (Untuk keperluan UI Testing)
            const dummyData = {
                total_siswa: 32,
                sesi_selesai: 28,
                rata_skor: 85,
                tabel: [
                    { id_sesi: 'SES-001', nama: 'Budi Santoso', waktu: '10:45 AM', skor: 95 },
                    { id_sesi: 'SES-002', nama: 'Ayu Lestari', waktu: '10:50 AM', skor: 70 },
                    { id_sesi: 'SES-003', nama: 'Dimas Anggara', waktu: '11:05 AM', skor: 40 }
                ]
            };

            const data = result.status === 'success' ? result.data : dummyData;

            // Render Kartu Metrik
            document.getElementById('totalSiswa').innerText = data.total_siswa;
            document.getElementById('totalSesi').innerText = data.sesi_selesai;
            document.getElementById('rataSkor').innerText = data.rata_skor;

            // Render Tabel Data
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; // Bersihkan loading

            data.tabel.forEach(row => {
                // Logika Pewarnaan (Color-Coding) berdasarkan Total XP
                let badgeClass = 'bg-danger'; // Skor di bawah 50
                let statusText = 'Perlu Bimbingan';
                
                if (row.skor >= 80) {
                    badgeClass = 'bg-success';
                    statusText = 'Sangat Baik';
                } else if (row.skor >= 50) {
                    badgeClass = 'bg-warning text-dark';
                    statusText = 'Cukup';
                }

                const tr = `
                    <tr>
                        <td class="fw-bold text-muted">${row.id_sesi}</td>
                        <td class="fw-bold">${row.nama}</td>
                        <td>${row.waktu}</td>
                        <td class="text-center fw-bold fs-5">${row.skor}</td>
                        <td class="text-center"><span class="badge ${badgeClass} px-3 py-2">${statusText}</span></td>
                    </tr>
                `;
                tbody.innerHTML += tr;
            });
        }

        // 2. Fungsi Unduh Excel
        function downloadExcel() {
            // Karena ekspor file tidak bisa ditangkap langsung oleh JSON fetch,
            // kita langsung mengarahkan browser ke endpoint PHP yang men-generate header Excel
            window.location.href = 'api/export_excel.php';
        }

        // 3. Fungsi Tambah Siswa (Manajemen Pengguna)
        document.getElementById('addUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nama = document.getElementById('newNama').value;
            const nis = document.getElementById('newNIS').value;
            const pass = document.getElementById('newPass').value;

            const result = await fetchAPI('user_management.php', 'POST', {
                action: 'add',
                nama: nama,
                nis: nis,
                password: pass
            });

            // Tutup modal bootstrap
            var modal = bootstrap.Modal.getInstance(document.getElementById('addUserModal'));
            modal.hide();

            Swal.fire('Berhasil!', `Siswa ${nama} berhasil ditambahkan.`, 'success');
            // Refresh data tabel
            loadDashboardData();
        });

        // 4. Fungsi Logout
        async function logout() {
            await fetchAPI('logout.php', 'POST');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
